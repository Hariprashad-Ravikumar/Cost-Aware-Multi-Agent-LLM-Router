services:
  postgres:
    image: postgres:16-alpine
    container_name: router_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=router
      - POSTGRES_PASSWORD=router
      - POSTGRES_DB=router
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: router_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: router_app
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://router:router@postgres:5432/router
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: router_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: router_grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
